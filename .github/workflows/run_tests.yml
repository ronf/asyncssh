name: Run tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - name: Checkout asyncssh
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Run checks
        run: uvx prek run --all-files

  run-tests:
    needs: lint
    name: Run tests
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    runs-on: ${{ matrix.os }}
    env:
      liboqs_version: '0.10.1'
      nettle_version: nettle_3.10.1_release_20241230
      nettle4_version: '4.0'
      nettle4_sha256: 3addbc00da01846b232fb3bc453538ea5468da43033f21bb345cb1e9073f5094

    steps:
      - name: Checkout asyncssh
        uses: actions/checkout@v7
        with:
          path: asyncssh

      - name: Checkout liboqs
        if: ${{ runner.os != 'macOS' }}
        uses: actions/checkout@v7
        with:
          repository: open-quantum-safe/liboqs
          ref: ${{ env.liboqs_version }}
          path: liboqs

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            asyncssh/setup.py
            asyncssh/tox.ini

      - name: Fix modules path for OpenSSL on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $openssl_path = ((Get-Command openssl).Path | Split-Path -Parent)
          echo "OPENSSL_MODULES=$openssl_path" >> $env:GITHUB_ENV

      - name: Verify legacy provider can be enabled in OpenSSL on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          openssl list -provider default -provider legacy -providers

      - name: Set up ccache for liboqs (Linux)
        uses: hendrikmuhs/ccache-action@v1.2.25
        if: ${{ runner.os == 'Linux' }}
        with:
          key: liboqs-cache-${{ matrix.os }}

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends libnettle8 libssl-dev libkrb5-dev ssh cmake ninja-build

      - name: Install nettle 4 (Linux, Python 3.15)
        if: ${{ runner.os == 'Linux' && matrix.python-version == '3.15' }}
        run: |
          sudo apt install -y --no-install-recommends m4
          curl -fLO https://ftpmirror.gnu.org/nettle/nettle-${{ env.nettle4_version }}.tar.gz
          echo "${{ env.nettle4_sha256 }}  nettle-${{ env.nettle4_version }}.tar.gz" | sha256sum -c
          tar xzf nettle-${{ env.nettle4_version }}.tar.gz
          cd nettle-${{ env.nettle4_version }}
          ./configure --prefix="$RUNNER_TEMP/nettle4" --libdir="$RUNNER_TEMP/nettle4/lib" --disable-public-key --disable-openssl --disable-documentation --disable-static
          make -j$(nproc)
          make install
          cp -L "$RUNNER_TEMP/nettle4/lib/libnettle.so.9" "$Python_ROOT_DIR/lib"

      - name: Install macOS dependencies
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install nettle@3 liboqs
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix nettle@3)/lib:$(brew --prefix)/lib" >> $GITHUB_ENV

      - name: Install nettle 4 (macOS, Python 3.15)
        if: ${{ runner.os == 'macOS' && matrix.python-version == '3.15' }}
        run: |
          brew install nettle
          cp -L "$(brew --prefix nettle)/lib/libnettle.9.dylib" "$Python_ROOT_DIR/lib"

      - name: Install nettle (Windows)
        if: ${{ runner.os == 'Windows' && matrix.python-version != '3.15' }}
        shell: pwsh
        run: |
          curl -fLO https://github.com/ShiftMediaProject/nettle/releases/download/${{ env.nettle_version }}/libnettle_${{ env.nettle_version }}_msvc17.zip
          Expand-Archive libnettle_${{ env.nettle_version }}_msvc17.zip nettle
          cp nettle\bin\x64\nettle.dll "$env:Python_ROOT_DIR"

      - name: Install nettle 4 (Windows, Python 3.15)
        if: ${{ runner.os == 'Windows' && matrix.python-version == '3.15' }}
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-nettle
          cp C:\msys64\ucrt64\bin\libnettle-9.dll "$env:Python_ROOT_DIR"

      - name: Install liboqs (Linux)
        if: ${{ runner.os == 'Linux' }}
        working-directory: liboqs
        run: |
          cmake -GNinja -Bbuild . -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DOQS_DIST_BUILD=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build
          sudo cmake --install build

      - name: Initialize MSVC environment
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vspath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vspath) { throw "Visual Studio with C++ tools not found" }
          $vcvars = Join-Path $vspath 'VC\Auxiliary\Build\vcvarsall.bat'
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vcvars`" x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) {
              "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat failed" }

      - name: Install liboqs (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        working-directory: liboqs
        run: |
          cmake -GNinja -Bbuild . -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DOQS_DIST_BUILD=ON
          cmake --build build
          cp build\bin\oqs.dll "$env:Python_ROOT_DIR"

      - name: Start OpenSSH agent service (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent
          Get-Service ssh-agent

      - name: Install Python dependencies
        run: pip install tox

      - name: Run tests
        shell: python
        working-directory: asyncssh
        run: |
          import os, sys, platform, subprocess
          V = sys.version_info
          p = platform.system().lower()
          subprocess.run(
              ['tox', 'run', '-e', f'py{V.major}{V.minor}-{p}', '--', '-ra'],
              check=True)

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: asyncssh/.coverage.*
          include-hidden-files: true
          retention-days: 1

  merge-coverage:
    runs-on: ubuntu-latest
    needs: run-tests
    if: ${{ always() }}
    permissions:
      actions: write
    steps:
      - name: Merge coverage
        uses: actions/upload-artifact/merge@v7
        with:
          name: coverage
          pattern: coverage-*
          include-hidden-files: true

  report-coverage:
    name: Report coverage
    runs-on: ubuntu-latest
    needs: merge-coverage
    if: ${{ always() }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: Install dependencies
        run: |
          sudo apt install -y sqlite3
          pip install tox
      - name: Report coverage
        run: |
          shopt -s nullglob
          for f in .coverage.*-windows; do
            sqlite3 "$f" "update file set path = replace(path, '\\', '/');"
          done
          tox -e report
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
